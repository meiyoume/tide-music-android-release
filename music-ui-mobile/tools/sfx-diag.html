<!doctype html>
<meta charset="utf-8">
<title>sfx sheet diag</title>
<style>html,body{margin:0;height:100%;background:#06070A}iframe{display:block;border:0;width:100%;height:100%}</style>
<iframe id="app" src="../index.html"></iframe>
<script>
(function () {
  var out = [];
  function send(t) { try { fetch('/result', { method: 'POST', body: t }); } catch (e) {} }
  document.getElementById('app').addEventListener('load', function () {
    var doc = this.contentDocument, win = this.contentWindow;
    var q = function (s) { return doc.querySelector(s); };
    var qa = function (s) { return [].slice.call(doc.querySelectorAll(s)); };
    setTimeout(function () {
      q('#listLikes [data-token]').click();
      setTimeout(function () {
        q('#miniTap').click();
        setTimeout(function () {
          q('#pSfx').click();
          setTimeout(function () {
            q('#sfxSheet [data-sfx-pack="wood"]').click();
            setTimeout(function () {
              out.push('Sfx.pack = ' + (win.Sfx && win.Sfx.pack));
              out.push('全文档 [data-sfx-pack] 数量 = ' + qa('[data-sfx-pack]').length);
              qa('[data-sfx-pack]').forEach(function (b) {
                var d = b.querySelector('.radio');
                out.push('  pack=' + b.dataset.sfxPack +
                  ' 按钮class=' + b.className +
                  ' 在#' + (b.closest('[id]') ? b.closest('[id]').id : '?') +
                  ' .radio=' + (d ? '有 class=' + d.className +
                    ' bg=' + win.getComputedStyle(d).backgroundColor +
                    ' 匹配规则=' + matched(d) : '没有'));
              });
              send(out.join('\n'));
            }, 300);
          }, 400);
        }, 400);
      }, 700);
    }, 1500);

    function matched(el) {
      var hits = [];
      try {
        var sheets = doc.styleSheets;
        for (var i = 0; i < sheets.length; i++) {
          var rules = sheets[i].cssRules || [];
          for (var j = 0; j < rules.length; j++) {
            var r = rules[j];
            if (r.selectorText && r.selectorText.indexOf('.radio') > -1) {
              try { if (el.matches(r.selectorText)) hits.push(r.selectorText); } catch (e) {}
            }
          }
        }
      } catch (e) { return '读不到样式表：' + e.message; }
      return hits.join(' , ');
    }
  });
})();
</script>
