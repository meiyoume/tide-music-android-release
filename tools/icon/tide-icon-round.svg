<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 圆形版本（Android 的 ic_launcher_round / 老启动器的圆图标）。几何与方版一致，只换裁剪。 -->
  <defs>
    <linearGradient id="bg" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0%" stop-color="#1ad39c"/>
      <stop offset="55%" stop-color="#15b7ae"/>
      <stop offset="100%" stop-color="#0e93e6"/>
    </linearGradient>
    <clipPath id="round"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <g transform="translate(76,52) scale(15)">
      <path d="M9 18V5l12-2v13" fill="none" stroke="#fff" stroke-width="2.7"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="6" cy="18" r="3.2" fill="#fff"/>
      <circle cx="18" cy="16" r="3.2" fill="#fff"/>
    </g>
    <path d="M44 436c 52 -42 104 -42 156 0s 104 42 156 0s 52 -42 104 0"
          fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round" opacity=".9"/>
  </g>
</svg>
