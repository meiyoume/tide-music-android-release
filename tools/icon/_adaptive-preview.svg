<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 512 512">
  <!--
    自适应图标的模拟图。**viewBox 必须和 res/drawable/ic_launcher_foreground.xml 一样是 512**，
    group 的 translate/scale 也要一模一样 —— 否则模拟图看着对、真机上偏到角落去
    （第一版就是这么翻的：模拟图用 108 视口配 512 的位移，两边根本不是同一个坐标系）。

    红虚线圆 = 中心 66dp 的安全区（半径 33dp，换算到 512 视口是 156.4）。
    前景里所有墨点都必须在这个圆里，否则圆形蒙版会切掉。
  -->
  <defs>
    <!-- 渐变坐标按 512 视口写（和 ic_launcher_bg.xml 里 108 视口的 (5.4,0)-(102.6,108) 是同一段） -->
    <linearGradient id="bg" x1="25.6" y1="0" x2="486.4" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1ad39c"/>
      <stop offset="55%" stop-color="#15b7ae"/>
      <stop offset="100%" stop-color="#0e93e6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(56.34,87.46) scale(0.7545)">
    <g transform="translate(76,52) scale(15)">
      <path d="M9 18V5l12-2v13" fill="none" stroke="#fff" stroke-width="2.7"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="6" cy="18" r="3.2" fill="#fff"/>
      <circle cx="18" cy="16" r="3.2" fill="#fff"/>
    </g>
  </g>
  <circle cx="256" cy="256" r="156.4" fill="none" stroke="#ff2d55" stroke-width="2"
          stroke-dasharray="8 8"/>
</svg>
